name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore
        run: dotnet restore RobloxUsernameChecker/RobloxUsernameChecker.csproj

      - name: Build APK
        run: dotnet publish RobloxUsernameChecker/RobloxUsernameChecker.csproj -c Release -f net10.0-android -p:AndroidPackageFormat=apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RobloxUsernameChecker-APK
          path: RobloxUsernameChecker/bin/Release/net10.0-android/publish/*.apk
